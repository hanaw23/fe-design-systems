name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        type: choice
        options:
          - react
          - tokens
          - both

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build tokens
        run: npm run build:tokens

      - name: Build React
        if: inputs.package == 'react' || inputs.package == 'both'
        run: npm run build:react

      - name: Publish tokens
        if: inputs.package == 'tokens' || inputs.package == 'both'
        run: npm publish -w @fe-design-systems/tokens --access public

      - name: Publish React
        if: inputs.package == 'react' || inputs.package == 'both'
        run: npm publish -w @fe-design-systems/react --access public
